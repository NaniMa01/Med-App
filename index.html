<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Forensics Hub 2.1 - Stealth Mode</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 25px;
        }

        .user-stats {
            display: flex; gap: 20px; background: var(--card-bg); padding: 10px 20px;
            border-radius: 8px; border: 1px solid var(--border-color);
        }

        .stat-badge { font-size: 0.9rem; color: var(--text-muted); }
        .stat-badge strong { color: var(--accent-blue); }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn {
            background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
        }
        .tab-btn:hover, .tab-btn.active { border-color: var(--accent-blue); color: var(--text-main); }
        .tab-btn.active { background: var(--accent-blue); color: var(--bg-color); }

        .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .case-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .case-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }

        .tag-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .tag { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #0f172a; color: var(--accent-blue); }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: var(--border-color); color: var(--text-muted); }
        .status-solved { background: rgba(34, 197, 94, 0.2); color: var(--success); }

        .case-title { font-size: 1.15rem; font-weight: 600; margin: 0 0 15px 0; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 12px; }

        #player-view { display: none; }
        .back-btn { background: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { background: rgba(56, 189, 248, 0.1); }

        .timeline-step { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 25px; margin-bottom: 15px; }
        .step-header { font-size: 0.85rem; color: var(--accent-blue); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
        .step-content { font-size: 1.1rem; margin-bottom: 15px; padding: 15px; background: #0f172a; border-radius: 6px; border-left: 3px solid var(--border-color); user-select: none; }

        /* V2.1 STEALTH MODE STYLING */
        .stealth-word, .stealth-hotspot {
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            margin-right: 4px; /* Ersetzt das Leerzeichen für sauberes Klicken */
        }
        
        /* Ein extrem subtiler Hover-Effekt, damit man merkt, dass der Text interaktiv ist */
        .stealth-word:hover, .stealth-hotspot:hover {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        /* Wenn der User auf ein irrelevantes Wort klickt (Generic Noise) */
        .resolved-generic {
            color: #475569; /* Verblasst */
            pointer-events: none;
        }

        /* Wenn der User einen definierten, aber nicht fehlerhaften Hotspot klickt */
        .resolved-noise {
            color: var(--text-muted);
            text-decoration: line-through;
            pointer-events: none;
        }

        /* Wenn der User den FATALEN Fehler findet */
        .resolved-signal {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-weight: bold;
            border-radius: 4px;
            padding: 0 4px;
            pointer-events: none;
        }

        .step-actions { display: flex; gap: 10px; }
        button.action-btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
        .btn-valid { background: #065f46; color: #34d399; }
        .btn-invalid { background: #7f1d1d; color: #fca5a5; }

        .feedback-box { margin-top: 15px; padding: 15px; border-radius: 6px; font-size: 0.95rem; display: none; }
        .feedback-success { background: rgba(34, 197, 94, 0.1); border-left: 4px solid var(--success); color: #86efac; }
        .feedback-error { background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--error); color: #fca5a5; }
        .feedback-neutral { background: rgba(148, 163, 184, 0.1); border-left: 4px solid var(--text-muted); color: var(--text-main); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1 style="margin: 0; font-size: 1.5rem;">Clinical Forensics Hub</h1>
                <span style="color: var(--text-muted); font-size: 0.9rem;">Sokratisches Chart Auditing</span>
            </div>
            <div class="user-stats">
                <div class="stat-badge">Rang: <strong id="stat-rank">Assistenzarzt</strong></div>
                <div class="stat-badge">XP: <strong id="stat-xp">0</strong></div>
            </div>
        </header>

        <main id="dashboard-view">
            <div class="filter-tabs" id="filter-tabs"></div>
            <div class="case-grid" id="case-grid">Lade Fälle...</div>
        </main>

        <section id="player-view">
            <button class="back-btn" onclick="showDashboard()">← Zurück zum Dashboard</button>
            <div id="player-container"></div>
        </section>
    </div>

    <script>
        let currentCases = [];
        let activeCaseData = null;
        let activeFilter = 'Alle';

        document.addEventListener('DOMContentLoaded', () => {
            initUserData();
            loadManifest();
        });

        function initUserData() {
            if (!localStorage.getItem('user_xp')) {
                localStorage.setItem('user_xp', '0');
                localStorage.setItem('solved_cases', JSON.stringify([]));
            }
            updateStatsUI();
        }

        function updateStatsUI() {
            const xp = parseInt(localStorage.getItem('user_xp') || '0');
            document.getElementById('stat-xp').innerText = xp;
            let rank = 'Famulus';
            if (xp >= 1000) rank = 'Oberarzt';
            else if (xp >= 500) rank = 'Facharzt';
            else if (xp >= 200) rank = 'Assistenzarzt';
            document.getElementById('stat-rank').innerText = rank;
        }

        async function loadManifest() {
            try {
                const res = await fetch('./manifest.json?nocache=' + new Date().getTime());
                if (!res.ok) throw new Error(`HTTP Fehler: ${res.status}`);
                const data = await res.json();
                currentCases = data.cases;
                renderTabs();
                filterAndRenderCases('Alle');
            } catch (err) {
                console.error('Manifest-Ladefehler:', err);
                document.getElementById('case-grid').innerHTML = `<p style="color: var(--error);">Fehler beim Laden des Manifests.</p>`;
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('filter-tabs');
            const fields = ['Alle', ...new Set(currentCases.map(c => c.medical_field))];
            tabsContainer.innerHTML = '';
            fields.forEach(field => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${field === activeFilter ? 'active' : ''}`;
                btn.innerText = field;
                btn.onclick = () => {
                    activeFilter = field;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndRenderCases(field);
                };
                tabsContainer.appendChild(btn);
            });
        }

        function filterAndRenderCases(field) {
            const grid = document.getElementById('case-grid');
            grid.innerHTML = '';
            const solvedCases = JSON.parse(localStorage.getItem('solved_cases') || '[]');
            const filtered = field === 'Alle' ? currentCases : currentCases.filter(c => c.medical_field === field);

            filtered.forEach(c => {
                const isSolved = solvedCases.includes(c.id);
                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = () => openCase(c.file_path, c.id);

                card.innerHTML = `
                    <div>
                        <div class="tag-row">
                            <span class="tag">${c.medical_field}</span>
                            <span class="status-badge ${isSolved ? 'status-solved' : ''}">${isSolved ? '✓ Abgeschlossen' : 'Offen'}</span>
                        </div>
                        <h3 class="case-title">${c.title}</h3>
                    </div>
                    <div class="card-footer">
                        <span>Bloom: <strong>${c.bloom_level}</strong></span>
                        <span>+${c.xp_reward} XP</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function openCase(filePath, caseId) {
            try {
                const res = await fetch('./' + filePath + '?nocache=' + new Date().getTime());
                if (!res.ok) throw new Error('Datei nicht gefunden');
                activeCaseData = await res.json();
                
                document.getElementById('dashboard-view').style.display = 'none';
                document.getElementById('player-view').style.display = 'block';
                renderTimeline(caseId);
            } catch (err) {
                alert('Der Fall konnte nicht geladen werden.');
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // V2.1 Der Stealth-Parser
        function parseStealthText(text, hotspots, stepIndex) {
            let parsedText = text;

            // 1. Schütze die echten Hotspots durch Platzhalter (entfernt die eckigen Klammern)
            if (hotspots && hotspots.length > 0) {
                hotspots.forEach((hs, hsIndex) => {
                    const regex = new RegExp(`\\[${escapeRegExp(hs.phrase)}\\]`, 'g');
                    parsedText = parsedText.replace(regex, `__HOTSPOT_${hsIndex}__`);
                });
            }

            // 2. Wickle jedes verbleibende Wort in einen generischen, unsichtbaren Klick-Container
            parsedText = parsedText.split(/\s+/).map(word => {
                if (word.startsWith('__HOTSPOT_')) return word; // Platzhalter ignorieren
                return `<span class="stealth-word" onclick="handleGenericClick(this)">${word}</span>`;
            }).join(''); // Kein Leerzeichen beim Join, da wir margin-right im CSS nutzen

            // 3. Setze die echten Hotspots (getarnt) wieder ein
            if (hotspots && hotspots.length > 0) {
                hotspots.forEach((hs, hsIndex) => {
                    const replacementHtml = `<span class="stealth-hotspot" id="hs-${stepIndex}-${hsIndex}" onclick="evaluateHotspot(${stepIndex}, ${hsIndex})">${hs.phrase}</span>`;
                    parsedText = parsedText.replace(`__HOTSPOT_${hsIndex}__`, replacementHtml);
                });
            }

            return parsedText;
        }

        function renderTimeline(caseId) {
            const container = document.getElementById('player-container');
            container.innerHTML = `
                <div style="margin-bottom: 25px;">
                    <h2>${activeCaseData.metadata.title}</h2>
                    <p style="color: var(--text-muted);"><strong>Chart Audit:</strong> Analysiere den Text. Jedes Wort ist anklickbar. Finde die fatalen Entscheidungen oder Befunde, ignoriere irrelevantes Rauschen.</p>
                </div>
                <div id="steps-wrapper"></div>
            `;

            const wrapper = document.getElementById('steps-wrapper');
            activeCaseData.timeline.forEach((step, index) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'timeline-step';
                stepDiv.id = `step-${index}`;

                // Text durch den Stealth-Parser jagen
                let htmlContent = step.hotspots ? parseStealthText(step.content, step.hotspots, index) : step.content;

                stepDiv.innerHTML = `
                    <div class="step-header">Schritt ${index + 1}: ${step.phase}</div>
                    <div class="step-content">${htmlContent}</div>
                    
                    ${!step.hotspots ? `
                        <!-- Fallback für alte V1 Fälle ohne Text-Audit -->
                        <div class="step-actions" id="actions-${index}">
                            <button class="action-btn btn-valid" onclick="evaluateLegacyStep(${index}, false)">Klinisch Korrekt</button>
                            <button class="action-btn btn-invalid" onclick="evaluateLegacyStep(${index}, true)">Fehlerhaft</button>
                        </div>
                    ` : ''}
                    
                    <div class="feedback-box" id="feedback-${index}"></div>
                `;
                wrapper.appendChild(stepDiv);
            });
        }

        // Wenn auf ein irrelevantes Wort geklickt wird
        window.handleGenericClick = function(el) {
            el.classList.add('resolved-generic');
        }

        // V2.1 Stealth Hotspot Evaluierung
        window.evaluateHotspot = function(stepIndex, hotspotIndex) {
            const step = activeCaseData.timeline[stepIndex];
            const hs = step.hotspots[hotspotIndex];
            const span = document.getElementById(`hs-${stepIndex}-${hotspotIndex}`);
            const feedbackBox = document.getElementById(`feedback-${stepIndex}`);

            if (span.classList.contains('resolved-noise') || span.classList.contains('resolved-signal')) return;

            feedbackBox.style.display = 'block';

            if (hs.is_error) {
                // Der FATALE Fehler wurde gefunden
                span.classList.add('resolved-signal');
                feedbackBox.className = 'feedback-box feedback-error';
                feedbackBox.innerHTML = `
                    <strong>Treffer!</strong> Du hast die kritische Variable auditiert.<br><br>
                    <strong>Sokratischer Einspruch:</strong> ${hs.socratic_trap}<br><br>
                    <button class="action-btn btn-valid" style="margin-top: 10px;" onclick="revealSynthesis(${stepIndex}, ${hotspotIndex})">Ich habe es durchdacht - Synthese aufdecken</button>
                `;
            } else {
                // Ein definierter Hotspot (Noise) wurde geklickt
                span.classList.add('resolved-noise');
                feedbackBox.className = 'feedback-box feedback-neutral';
                feedbackBox.innerHTML = `<strong>Klinisch erfasst:</strong> ${hs.feedback} <br><em>Das ist nicht der gesuchte Fehler. Untersuche den Text weiter.</em>`;
            }
        }

        window.revealSynthesis = function(stepIndex, hotspotIndex) {
            const hs = activeCaseData.timeline[stepIndex].hotspots[hotspotIndex];
            const feedbackBox = document.getElementById(`feedback-${stepIndex}`);
            feedbackBox.className = 'feedback-box feedback-success';
            feedbackBox.innerHTML = `<strong>Pathophysiologische Synthese:</strong> ${hs.correct_pathophysiology}`;
            checkCompletion();
        }

        // V1 Fallback
        window.evaluateLegacyStep = function(index, userThoughtError) {
            const step = activeCaseData.timeline[index];
            const feedbackBox = document.getElementById(`feedback-${index}`);
            document.getElementById(`actions-${index}`).style.display = 'none';
            feedbackBox.style.display = 'block';

            if (userThoughtError === step.contains_error) {
                feedbackBox.className = 'feedback-box feedback-success';
                feedbackBox.innerHTML = `<strong>Korrekt!</strong> ${step.correct_pathophysiology || step.feedback}`;
                checkCompletion();
            } else {
                feedbackBox.className = 'feedback-box feedback-error';
                feedbackBox.innerHTML = `<strong>Denkfehler:</strong> ${step.socratic_trap?.counter_question || 'Überdenke die Pathophysiologie.'}`;
            }
        }

        function checkCompletion() {
            let currentXp = parseInt(localStorage.getItem('user_xp') || '0');
            currentXp += activeCaseData.metadata?.xp_reward || 250;
            localStorage.setItem('user_xp', currentXp);
            
            let solved = JSON.parse(localStorage.getItem('solved_cases') || '[]');
            if (!solved.includes(activeCaseData.case_id)) {
                solved.push(activeCaseData.case_id);
                localStorage.setItem('solved_cases', JSON.stringify(solved));
            }
            updateStatsUI();
        }

        function showDashboard() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            updateStatsUI();
            filterAndRenderCases(activeFilter);
        }
    </script>
</body>
</html>
